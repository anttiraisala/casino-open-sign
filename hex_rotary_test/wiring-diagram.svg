<svg xmlns='http://www.w3.org/2000/svg' width='210mm' height='297mm' viewBox='-38.7629 -264.036 1017.53 1439.07'>
<rect x='-38.7629' y='-264.036' width='1017.53' height='1439.07' fill='#ffffff'/>
<text x='470' y='22' font-size='17' text-anchor='middle' fill='#222222' font-weight='bold' font-family='DejaVu Sans, Arial, sans-serif'>Hex rotary switch test - wiring</text>
<rect x='540' y='70' width='360' height='570' rx='0' fill='#e8f0fe' stroke='#222222' stroke-width='2'/>
<text x='720' y='94' font-size='14' text-anchor='middle' fill='#222222' font-weight='bold' font-family='DejaVu Sans, Arial, sans-serif'>Arduino Mega 2560</text>
<text x='720' y='112' font-size='11' text-anchor='middle' fill='#666666' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>powered over USB for this test</text>
<text x='40' y='94' font-size='13' text-anchor='start' fill='#222222' font-weight='bold' font-family='DejaVu Sans, Arial, sans-serif'>SW  hex rotary switch 0-F</text>
<text x='40' y='110' font-size='10' text-anchor='start' fill='#666666' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>6 legs: 1, 2, 4, 8 and two C (common, joined inside)</text>
<rect x='60' y='120' width='150' height='150' rx='0' fill='#f3f3f3' stroke='#222222' stroke-width='2'/>
<circle cx='110' cy='182' r='26' fill='#ffffff' stroke='#222222' stroke-width='2'/>
<line x1='110' y1='182' x2='110' y2='160' stroke='#222222' stroke-width='2.5'/>
<circle cx='110' cy='182' r='3' fill='#222222'/>
<text x='110' y='232' font-size='12' text-anchor='middle' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>0 .. F</text>
<text x='202' y='149' font-size='11' text-anchor='end' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>leg 1</text>
<circle cx='210' cy='145' r='3.5' fill='#ffffff' stroke='#ef6c00' stroke-width='2'/>
<line x1='210' y1='145' x2='540' y2='145' stroke='#ef6c00' stroke-width='2'/>
<text x='548' y='149' font-size='13' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>D34</text>
<text x='300' y='140' font-size='10' text-anchor='start' fill='#666666' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>bit 0 (weight 1)</text>
<text x='202' y='177' font-size='11' text-anchor='end' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>leg 2</text>
<circle cx='210' cy='173' r='3.5' fill='#ffffff' stroke='#ef6c00' stroke-width='2'/>
<line x1='210' y1='173' x2='540' y2='173' stroke='#ef6c00' stroke-width='2'/>
<text x='548' y='177' font-size='13' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>D35</text>
<text x='300' y='168' font-size='10' text-anchor='start' fill='#666666' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>bit 1 (weight 2)</text>
<text x='202' y='205' font-size='11' text-anchor='end' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>leg 4</text>
<circle cx='210' cy='201' r='3.5' fill='#ffffff' stroke='#ef6c00' stroke-width='2'/>
<line x1='210' y1='201' x2='540' y2='201' stroke='#ef6c00' stroke-width='2'/>
<text x='548' y='205' font-size='13' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>D36</text>
<text x='300' y='196' font-size='10' text-anchor='start' fill='#666666' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>bit 2 (weight 4)</text>
<text x='202' y='233' font-size='11' text-anchor='end' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>leg 8</text>
<circle cx='210' cy='229' r='3.5' fill='#ffffff' stroke='#ef6c00' stroke-width='2'/>
<line x1='210' y1='229' x2='540' y2='229' stroke='#ef6c00' stroke-width='2'/>
<text x='548' y='233' font-size='13' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>D37</text>
<text x='300' y='224' font-size='10' text-anchor='start' fill='#666666' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>bit 3 (weight 8)</text>
<text x='160' y='262' font-size='12' text-anchor='middle' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>C</text>
<circle cx='160' cy='270' r='3.5' fill='#ffffff' stroke='#ef6c00' stroke-width='2'/>
<line x1='160' y1='270' x2='160' y2='284' stroke='#ef6c00' stroke-width='2'/>
<line x1='160' y1='284' x2='160' y2='292' stroke='#222222' stroke-width='2'/>
<line x1='151' y1='292' x2='169' y2='292' stroke='#222222' stroke-width='2'/>
<line x1='154' y1='296' x2='166' y2='296' stroke='#222222' stroke-width='2'/>
<line x1='157' y1='300' x2='163' y2='300' stroke='#222222' stroke-width='2'/>
<text x='160' y='316' font-size='10' text-anchor='middle' fill='#666666' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>one C leg to GND (the other C leg is left free)</text>
<text x='40' y='336' font-size='11' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>No resistors: the Mega's internal pull-ups (INPUT_PULLUP) are used.</text>
<text x='40' y='352' font-size='11' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>A leg connected to C reads LOW = bit set (sketch: HEX_BIT_IS_LOW).</text>
<text x='40' y='400' font-size='13' text-anchor='start' fill='#222222' font-weight='bold' font-family='DejaVu Sans, Arial, sans-serif'>LCD  2x16 character LCD, I2C backpack</text>
<text x='40' y='416' font-size='10' text-anchor='start' fill='#666666' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>shows A, the switch position and the direction</text>
<text x='40' y='430' font-size='10' text-anchor='start' fill='#666666' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>(I2C address 0x27; the boot scan on the Serial Monitor lists the real one)</text>
<rect x='60' y='440' width='150' height='100' rx='0' fill='#f3f3f3' stroke='#222222' stroke-width='2'/>
<text x='110' y='494' font-size='13' text-anchor='middle' fill='#222222' font-weight='bold' font-family='DejaVu Sans, Arial, sans-serif'>LCD</text>
<text x='110' y='512' font-size='11' text-anchor='middle' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>16 x 2</text>
<text x='202' y='458' font-size='11' text-anchor='end' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>GND</text>
<circle cx='210' cy='454' r='3.5' fill='#ffffff' stroke='#222222' stroke-width='2'/>
<line x1='210' y1='454' x2='226' y2='454' stroke='#222222' stroke-width='2'/>
<line x1='226' y1='454' x2='226' y2='462' stroke='#222222' stroke-width='2'/>
<line x1='217' y1='462' x2='235' y2='462' stroke='#222222' stroke-width='2'/>
<line x1='220' y1='466' x2='232' y2='466' stroke='#222222' stroke-width='2'/>
<line x1='223' y1='470' x2='229' y2='470' stroke='#222222' stroke-width='2'/>
<text x='202' y='482' font-size='11' text-anchor='end' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>VCC</text>
<circle cx='210' cy='478' r='3.5' fill='#ffffff' stroke='#c62828' stroke-width='2'/>
<line x1='210' y1='478' x2='540' y2='478' stroke='#c62828' stroke-width='2'/>
<text x='548' y='482' font-size='13' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>5V pin</text>
<text x='202' y='506' font-size='11' text-anchor='end' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>SDA</text>
<circle cx='210' cy='502' r='3.5' fill='#ffffff' stroke='#2e7d32' stroke-width='2'/>
<line x1='210' y1='502' x2='540' y2='502' stroke='#2e7d32' stroke-width='2'/>
<text x='548' y='506' font-size='13' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>D20 (SDA)</text>
<text x='202' y='530' font-size='11' text-anchor='end' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>SCL</text>
<circle cx='210' cy='526' r='3.5' fill='#ffffff' stroke='#2e7d32' stroke-width='2'/>
<line x1='210' y1='526' x2='540' y2='526' stroke='#2e7d32' stroke-width='2'/>
<text x='548' y='530' font-size='13' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>D21 (SCL)</text>
<text x='548' y='622' font-size='11' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>Pin 13: onboard LED = sign of life (blinks while the program runs)</text>
<line x1='40' y1='690' x2='80' y2='690' stroke='#ef6c00' stroke-width='2'/>
<text x='88' y='694' font-size='11' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>switch leg</text>
<line x1='190' y1='690' x2='230' y2='690' stroke='#2e7d32' stroke-width='2'/>
<text x='238' y='694' font-size='11' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>I2C (SDA / SCL)</text>
<line x1='380' y1='690' x2='420' y2='690' stroke='#c62828' stroke-width='2.5'/>
<text x='428' y='694' font-size='11' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>+5 V</text>
<line x1='490' y1='690' x2='530' y2='690' stroke='#222222' stroke-width='2.5'/>
<text x='538' y='694' font-size='11' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>GND</text>
<text x='40' y='720' font-size='12' text-anchor='start' fill='#222222' font-weight='bold' font-family='DejaVu Sans, Arial, sans-serif'>Connections</text>
<text x='40' y='739' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>1. Switch leg 1 -> D34, leg 2 -> D35, leg 4 -> D36, leg 8 -> D37; one C leg -> GND (any Mega GND pin).</text>
<text x='40' y='758' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>2. LCD: GND -> GND, VCC -> 5V, SDA -> D20, SCL -> D21 (the Mega's own I2C pins; no pull-up resistors needed).</text>
<text x='40' y='777' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>3. Power: USB cable to the PC (upload, Serial Monitor at 115200 baud). No LED strips or sticks are connected.</text>
<text x='40' y='796' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>4. If the legs are not marked, look for the numbers 1, 2, 4, 8 and the two letters C on the switch body.</text>
<text x='40' y='815' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>5. If A goes the wrong way: set reverseDirection to true in sketch.ino. If position 0 shows as F: set HEX_BIT_IS_LOW</text>
<text x='40' y='834' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>   to false (the switch is complement-coded).</text>
<text x='40' y='853' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>6. If the LCD shows no text but its light is on: turn the blue contrast trimmer on the I2C backpack, and check that</text>
<text x='40' y='872' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>   the LCD VCC pin measures at least 4.75 V (see README.txt).</text>
</svg>
