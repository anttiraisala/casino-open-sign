<text x='24' y='406' font-size='11' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>The setting number (blinks of the built-in LED, also in the Serial Monitor) where you see red, green, blue in this order is the colour order to use.</text>
<text x='24' y='422' font-size='11' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>Wrong settings show other colours (for example green, red, blue), nothing, white, or flicker.</text>
