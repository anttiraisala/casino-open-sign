<text x='550' y='32' font-size='19' text-anchor='middle' fill='#222222' font-weight='bold' font-family='DejaVu Sans, Arial, sans-serif'>LED strip test - layout of the piece and what to look for</text>
<text x='550' y='50' font-size='12' text-anchor='middle' fill='#666666' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>A piece of 3 to 6 pixel segments (10 cm each) is enough. Each segment has 3 LEDs.</text>
