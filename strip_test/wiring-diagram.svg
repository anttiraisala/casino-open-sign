<line x1='520' y1='235' x2='560' y2='235' stroke='#c62828' stroke-width='2.5'/>
<circle cx='560' cy='235' r='3.5' fill='#ffffff' stroke='#c62828' stroke-width='2'/>
<circle cx='560' cy='455' r='3.5' fill='#ffffff' stroke='#222222' stroke-width='2'/>
<line x1='560' y1='455' x2='490' y2='455' stroke='#222222' stroke-width='2.5'/>
<line x1='490' y1='455' x2='490' y2='270' stroke='#222222' stroke-width='2.5'/>
<line x1='490' y1='270' x2='560' y2='270' stroke='#222222' stroke-width='2.5'/>
<circle cx='560' cy='270' r='3.5' fill='#ffffff' stroke='#222222' stroke-width='2'/>
<line x1='260' y1='400' x2='490' y2='400' stroke='#222222' stroke-width='2.5'/>
<circle cx='490' cy='400' r='4' fill='#222222'/>
<line x1='260' y1='300' x2='330' y2='300' stroke='#ef6c00' stroke-width='2'/>
<circle cx='330' cy='300' r='3.5' fill='#ffffff' stroke='#ef6c00' stroke-width='2'/>
<line x1='334' y1='288' x2='416' y2='288' stroke='#222222' stroke-width='2.5'/>
<line x1='375' y1='288' x2='375' y2='274' stroke='#222222' stroke-width='2'/>
<circle cx='420' cy='300' r='3.5' fill='#ffffff' stroke='#ef6c00' stroke-width='2'/>
<line x1='420' y1='300' x2='440' y2='300' stroke='#ef6c00' stroke-width='2'/>
<line x1='440' y1='300' x2='440' y2='330' stroke='#ef6c00' stroke-width='2'/>
<line x1='440' y1='330' x2='440' y2='338' stroke='#222222' stroke-width='2'/>
<line x1='431' y1='338' x2='449' y2='338' stroke='#222222' stroke-width='2'/>
<line x1='434' y1='342' x2='446' y2='342' stroke='#222222' stroke-width='2'/>
<line x1='437' y1='346' x2='443' y2='346' stroke='#222222' stroke-width='2'/>
<text x='330' y='268' font-size='11' text-anchor='start' fill='#222222' font-weight='bold' font-family='DejaVu Sans, Arial, sans-serif'>optional push button</text>
<text x='330' y='254' font-size='10' text-anchor='start' fill='#666666' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>(next setting)</text>
<text x='40' y='580' font-size='12' text-anchor='start' fill='#222222' font-weight='bold' font-family='DejaVu Sans, Arial, sans-serif'>Connections</text>
<text x='40' y='600' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>1. Arduino D6 -> 330 ohm resistor -> DIN of the strip piece (the end where the printed arrows point away from).</text>
<text x='40' y='620' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>2. The strip's +12 V comes from the 12 V supply, NEVER from the Arduino 5V pin. Do not connect 12 V to any Arduino pin.</text>
<text x='40' y='640' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>3. GND of the 12 V supply, GND of the strip and GND of the Arduino are connected together (common ground).</text>
<text x='40' y='660' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>4. The Arduino is powered from USB. The push button (D3 to GND) is optional: it moves to the next setting.</text>
<text x='40' y='680' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>5. Optional: a 1000 uF capacitor rated 25 V or more across the strip's +12 V and GND (plus to +12 V, stripe = minus).</text>
<text x='40' y='700' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>6. The built-in LED (pin 13) blinks the setting number 1..12 at the start of each setting; the Serial Monitor (115200)</text>
<text x='40' y='720' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>   prints it too. Tell which setting numbers show red, green, blue in order and how many LEDs light up in each step.</text>
<text x='40' y='740' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>7. If nothing lights: check the strip direction (DIN end), the common GND and that the 12 V supply is on.</text>
</svg>
