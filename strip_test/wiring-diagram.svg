<text x='160' y='146' font-size='11' text-anchor='middle' fill='#666666' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>powered from USB</text>
<text x='252' y='204' font-size='12' text-anchor='end' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>D6</text>
<text x='252' y='304' font-size='12' text-anchor='end' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>D3</text>
<text x='252' y='404' font-size='12' text-anchor='end' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>GND</text>
<line x1='260' y1='200' x2='340' y2='200' stroke='#1565c0' stroke-width='2'/>
<line x1='340' y1='200' x2='348' y2='200' stroke='#1565c0' stroke-width='2'/>
<rect x='348' y='192' width='44' height='16' rx='0' fill='#ffffff' stroke='#1565c0' stroke-width='2'/>
<line x1='392' y1='200' x2='400' y2='200' stroke='#1565c0' stroke-width='2'/>
<text x='370' y='187' font-size='12' text-anchor='middle' fill='#1565c0' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>R1  330 ohm</text>
<line x1='400' y1='200' x2='560' y2='200' stroke='#1565c0' stroke-width='2'/>
<circle cx='560' cy='200' r='3.5' fill='#ffffff' stroke='#1565c0' stroke-width='2'/>
<rect x='560' y='160' width='260' height='130' rx='0' fill='#fff8e1' stroke='#222222' stroke-width='2'/>
<text x='580' y='184' font-size='13' text-anchor='start' fill='#222222' font-weight='bold' font-family='DejaVu Sans, Arial, sans-serif'>WS2811 12 V strip piece</text>
<text x='580' y='202' font-size='10.5' text-anchor='start' fill='#666666' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>3 to 6 pieces of 10 cm, cut only</text>
<text x='580' y='216' font-size='10.5' text-anchor='start' fill='#666666' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>at the marked cut lines</text>
<text x='556' y='196' font-size='10' text-anchor='end' fill='#1565c0' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>DIN</text>
<text x='556' y='231' font-size='10' text-anchor='end' fill='#c62828' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>+12 V</text>
<text x='556' y='266' font-size='10' text-anchor='end' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>GND</text>
<text x='580' y='252' font-size='10' text-anchor='start' fill='#666666' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>DIN end = the end the printed</text>
<text x='580' y='266' font-size='10' text-anchor='start' fill='#666666' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>arrows point away from</text>
<rect x='560' y='390' width='260' height='100' rx='0' fill='#f3f3f3' stroke='#222222' stroke-width='2'/>
<text x='580' y='418' font-size='13' text-anchor='start' fill='#222222' font-weight='bold' font-family='DejaVu Sans, Arial, sans-serif'>12 V DC supply, 1 A or more</text>
<text x='580' y='436' font-size='10.5' text-anchor='start' fill='#666666' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>(plug-in adapter, NOT the Arduino)</text>
<text x='546' y='414' font-size='14' text-anchor='end' fill='#c62828' font-weight='bold' font-family='DejaVu Sans, Arial, sans-serif'>+</text>
<text x='546' y='459' font-size='14' text-anchor='end' fill='#222222' font-weight='bold' font-family='DejaVu Sans, Arial, sans-serif'>-</text>
<circle cx='560' cy='410' r='3.5' fill='#ffffff' stroke='#c62828' stroke-width='2'/>
<line x1='560' y1='410' x2='520' y2='410' stroke='#c62828' stroke-width='2.5'/>
