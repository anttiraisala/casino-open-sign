<text x='450' y='34' font-size='17' text-anchor='middle' fill='#222222' font-weight='bold' font-family='DejaVu Sans, Arial, sans-serif'>LED strip test - wiring (Arduino Mega 2560 + a short piece of the 12 V strip)</text>
