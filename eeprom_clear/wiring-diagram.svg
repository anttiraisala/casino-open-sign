<svg xmlns='http://www.w3.org/2000/svg' width='297mm' height='210mm' viewBox='-26.7616 -71.2456 993.523 702.491'>
<rect x='-26.7616' y='-71.2456' width='993.523' height='702.491' fill='#ffffff'/>
<text x='470' y='24' font-size='17' text-anchor='middle' fill='#222222' font-weight='bold' font-family='DejaVu Sans, Arial, sans-serif'>EEPROM clear tool - wiring</text>
<text x='470' y='44' font-size='12' text-anchor='middle' fill='#666666' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>nothing is wired: only the USB cable between the PC and the Mega</text>
<rect x='60' y='110' width='200' height='150' rx='0' fill='#f3f3f3' stroke='#222222' stroke-width='2'/>
<text x='160' y='170' font-size='15' text-anchor='middle' fill='#222222' font-weight='bold' font-family='DejaVu Sans, Arial, sans-serif'>PC</text>
<text x='160' y='192' font-size='11' text-anchor='middle' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>Arduino IDE</text>
<text x='160' y='210' font-size='11' text-anchor='middle' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>Serial Monitor</text>
<text x='160' y='226' font-size='11' text-anchor='middle' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>115200 baud</text>
<text x='60' y='280' font-size='11' text-anchor='start' fill='#666666' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>USB port of the PC</text>
<circle cx='260' cy='185' r='3.5' fill='#ffffff' stroke='#c62828' stroke-width='2'/>
<line x1='260' y1='185' x2='540' y2='185' stroke='#c62828' stroke-width='3'/>
<circle cx='540' cy='185' r='3.5' fill='#ffffff' stroke='#c62828' stroke-width='2'/>
<text x='400' y='172' font-size='12' text-anchor='middle' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>USB cable (power, upload, Serial Monitor)</text>
<text x='400' y='204' font-size='10' text-anchor='middle' fill='#666666' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>USB-B plug into the Mega's USB connector</text>
<rect x='540' y='90' width='340' height='200' rx='0' fill='#e8f0fe' stroke='#222222' stroke-width='2'/>
<text x='710' y='118' font-size='14' text-anchor='middle' fill='#222222' font-weight='bold' font-family='DejaVu Sans, Arial, sans-serif'>Arduino Mega 2560</text>
<text x='710' y='150' font-size='12' text-anchor='middle' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>USB connector</text>
<text x='710' y='186' font-size='12' text-anchor='middle' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>No pin is used.</text>
<text x='710' y='204' font-size='12' text-anchor='middle' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>Nothing needs to be connected;</text>
<text x='710' y='222' font-size='12' text-anchor='middle' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>the sign hardware may stay plugged in.</text>
<text x='710' y='270' font-size='11' text-anchor='middle' fill='#666666' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>Pin 13: onboard LED = sign of life</text>
<text x='60' y='340' font-size='13' text-anchor='start' fill='#222222' font-weight='bold' font-family='DejaVu Sans, Arial, sans-serif'>How to use</text>
<text x='60' y='364' font-size='11' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>1. Connect the USB cable (the sign hardware may stay connected: the tool does not use any pin).</text>
<text x='60' y='384' font-size='11' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>2. Upload eeprom_clear/sketch.ino. At start-up it sets every EEPROM byte to 0xFF, once.</text>
<text x='60' y='404' font-size='11' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>3. Serial Monitor at 115200 baud: 'EEPROM cleared: all bytes are 0xFF.' and one DBG line per second. LED on pin 13 blinks slowly.</text>
<text x='60' y='424' font-size='11' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>4. A fast blink and 'EEPROM clear FAILED' mean that some byte could not be cleared (a worn-out EEPROM).</text>
<text x='60' y='444' font-size='11' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>5. Upload the sign program again: it finds no saved settings and starts with the default values of the menu.</text>
<line x1='60' y1='480' x2='100' y2='480' stroke='#c62828' stroke-width='2.5'/>
<text x='108' y='484' font-size='11' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>USB cable</text>
</svg>
