<text x='550' y='32' font-size='19' text-anchor='middle' fill='#222222' font-weight='bold' font-family='DejaVu Sans, Arial, sans-serif'>LED strip single LED - what to look for</text>
<text x='550' y='50' font-size='12' text-anchor='middle' fill='#666666' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>Three tests run at the same time, one per data pin. Each segment (10 cm) has 3 LEDs.</text>
<text x='24' y='86' font-size='14' text-anchor='start' fill='#222222' font-weight='bold' font-family='DejaVu Sans, Arial, sans-serif'>Test 1 (D9): one white pixel walks along the strip, one step every 150 ms, 150 steps, then again</text>
