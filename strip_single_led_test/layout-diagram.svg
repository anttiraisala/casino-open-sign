<text x='255' y='200' font-size='12' text-anchor='middle' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>lit pixel = one step</text>
<text x='24' y='226' font-size='11' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>If one chip drives 3 LEDs, the lit spot is a whole 10 cm segment and only the first 50 steps light something.</text>
<text x='24' y='242' font-size='11' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>Note after which step (Serial Monitor: t1=n/150) the strip stays dark: that is the real number of pixels.</text>
<text x='24' y='296' font-size='14' text-anchor='start' fill='#222222' font-weight='bold' font-family='DejaVu Sans, Arial, sans-serif'>Test 2 (D10): one pixel walks (60 ms per step), the colour changes every pass: red, green, blue, white</text>
