<text x='600' y='466' font-size='10.5' text-anchor='start' fill='#666666' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>(plug-in adapter, NOT the Arduino)</text>
<text x='600' y='484' font-size='10.5' text-anchor='start' fill='#666666' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>1.8 m of strip: 12 V 1 A is plenty</text>
<circle cx='820' cy='450' r='3.5' fill='#ffffff' stroke='#c62828' stroke-width='2'/>
