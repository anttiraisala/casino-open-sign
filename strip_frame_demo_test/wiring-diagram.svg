<circle cx='820' cy='495' r='3.5' fill='#ffffff' stroke='#222222' stroke-width='2'/>
<text x='814' y='491' font-size='14' text-anchor='end' fill='#222222' font-weight='bold' font-family='DejaVu Sans, Arial, sans-serif'>-</text>
<line x1='820' y1='495' x2='890' y2='495' stroke='#222222' stroke-width='2.5'/>
<circle cx='890' cy='495' r='4' fill='#222222'/>
<line x1='890' y1='560' x2='300' y2='560' stroke='#222222' stroke-width='2.5'/>
<line x1='300' y1='560' x2='300' y2='404' stroke='#222222' stroke-width='2.5'/>
<line x1='300' y1='404' x2='260' y2='404' stroke='#222222' stroke-width='2.5'/>
<circle cx='300' cy='560' r='4' fill='#222222'/>
<text x='40' y='610' font-size='12' text-anchor='start' fill='#222222' font-weight='bold' font-family='DejaVu Sans, Arial, sans-serif'>Connections</text>
<text x='40' y='630' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>1. Arduino D9 -> 330 ohm resistor R1 -> DIN of the frame strip (18 pixels, the end where the printed arrows point away from).</text>
<text x='40' y='650' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>2. Arduino D10 -> 330 ohm resistor R2 -> DIN of the single-pixel piece (one chip, 3 LEDs, cut from the same roll).</text>
<text x='40' y='670' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>3. The +12 V of both strips comes from the 12 V supply, NEVER from an Arduino pin. No 12 V on any Arduino pin.</text>
<text x='40' y='690' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>4. GND of the 12 V supply, GND of both strips and GND of the Arduino are connected together (common ground).</text>
<text x='40' y='710' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>5. The Arduino is powered from USB (the Serial Monitor, 115200 baud, shows one DBG line per second).</text>
<text x='40' y='730' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>6. Optional: a 1000 uF capacitor rated 25 V or more across +12 V and GND at the strip start (plus to +12 V).</text>
<text x='40' y='750' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>7. The built-in LED (pin 13) blinks while the program runs.</text>
<text x='40' y='770' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>8. Brightness peaks at 80 of 255 in the sketch (TEST_LEVEL); at most three lit pixels need very little current.</text>
</svg>
