<circle cx='300' cy='660' r='4' fill='#222222'/>
<text x='40' y='710' font-size='12' text-anchor='start' fill='#222222' font-weight='bold' font-family='DejaVu Sans, Arial, sans-serif'>Connections</text>
<text x='40' y='730' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>1. Arduino D9 -> 330 ohm resistor R1 -> DIN of the frame strip (18 pixels, the end where the printed arrows point away from).</text>
<text x='40' y='750' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>2. Arduino D10 -> 330 ohm resistor R2 -> DIN of the single-pixel piece (one chip, 3 LEDs, cut from the same roll).</text>
<text x='40' y='770' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>2b. Arduino D11 -> 330 ohm resistor R3 -> DIN of the colour bar (6 pixels = 18 LEDs, 60 cm, cut from the same roll).</text>
<text x='40' y='790' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>3. The +12 V of all three strips comes from the 12 V supply, NEVER from an Arduino pin. No 12 V on any Arduino pin.</text>
<text x='40' y='810' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>4. GND of the 12 V supply, GND of all strips and GND of the Arduino are connected together (common ground).</text>
<text x='40' y='830' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>5. The Arduino is powered from USB (the Serial Monitor, 115200 baud, shows one DBG line per second).</text>
<text x='40' y='850' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>6. Optional: a 1000 uF capacitor rated 25 V or more across +12 V and GND at the strip start (plus to +12 V).</text>
<text x='40' y='870' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>7. The built-in LED (pin 13) blinks while the program runs.</text>
<text x='40' y='890' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>8. Brightness peaks at 80 of 255 in the sketch (TEST_LEVEL); at most about ten lit pixels need very little current.</text>
</svg>
