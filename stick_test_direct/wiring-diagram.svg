<text x='460' y='784' font-size='11' text-anchor='start' fill='#ef6c00' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>D22 -> push button (optional) -> GND   held = load test (all LEDs white)</text>
<text x='460' y='802' font-size='11' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>Pin 13: onboard debug LED = sign of life (blinks while the program runs)</text>
<text x='40' y='844' font-size='12' text-anchor='start' fill='#222222' font-weight='bold' font-family='DejaVu Sans, Arial, sans-serif'>Connections</text>
<text x='40' y='863' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>1. Each stick is plugged with its own unmodified Grove cable into the n-th connector: stick 1 D2 ... stick 7 D8,</text>
<text x='40' y='882' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>   stick 8 A0, 9 A1, 10 A2, 11 A3 (the 11th is optional; set ACTIVE_STICKS in sketch.ino to the number you have).</text>
<text x='40' y='901' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>2. The shield 3V3/5V switch must be on 5 V. The stick power (red/black wires) goes through the shield and the Grove connectors.</text>
<text x='40' y='920' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>3. PSU V+ -> 10 A fuse F1 -> the Mega 5V pins; PSU V- -> the Mega GND pins (use the 5V and GND pins at the end of the long</text>
<text x='40' y='939' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>   double header, away from the shield; use both 5V pins and both GND pins, thick wire 1.5 mm2). C1 across the supply wires.</text>
<text x='40' y='958' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>4. Power the Arduino ONLY from the PSU: do not plug the USB cable while the PSU is on (upload the sketch first with USB, unplug, then power).</text>
<text x='40' y='977' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>5. No Serial Monitor output without USB; the pin 13 LED shows that the program runs.</text>
<text x='40' y='996' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>6. Feel the shield, the connectors and the wires after holding the load-test button for a minute: if anything gets warm, switch off and lower MAX_BRIGHTNESS.</text>
<text x='40' y='1015' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>7. The mains side of the supply must be in an enclosure and wired by a person who knows how (nothing here is mains).</text>
</svg>
