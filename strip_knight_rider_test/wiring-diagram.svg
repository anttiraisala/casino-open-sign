<circle cx='300' cy='610' r='4' fill='#222222'/>
<text x='40' y='650' font-size='12' text-anchor='start' fill='#222222' font-weight='bold' font-family='DejaVu Sans, Arial, sans-serif'>Connections</text>
<text x='40' y='670' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>1. Arduino D9, D10, D11 -> a 330 ohm resistor each -> DIN of strip 1, 2, 3 (the end where the printed arrows point away from).</text>
<text x='40' y='690' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>   One strip is enough: connect it to D9 (red, slow), D10 (blue) or D11 (green, fast).</text>
<text x='40' y='710' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>2. The +12 V of every strip comes from the 12 V supply, NEVER from an Arduino pin. No 12 V on any Arduino pin.</text>
<text x='40' y='730' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>3. GND of the 12 V supply, GND of all strips and GND of the Arduino are connected together (common ground).</text>
<text x='40' y='750' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>4. The Arduino is powered from USB (the Serial Monitor, 115200 baud, shows one DBG line per second).</text>
<text x='40' y='770' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>5. Optional: a 1000 uF capacitor rated 25 V or more across +12 V and GND at the strip start (plus to +12 V).</text>
<text x='40' y='790' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>6. The built-in LED (pin 13) blinks while the program runs.</text>
<text x='40' y='810' font-size='12' text-anchor='start' fill='#222222' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>7. Brightness is limited to 80 of 255 in the sketch (TEST_LEVEL); one lit pixel per strip needs very little current.</text>
</svg>
